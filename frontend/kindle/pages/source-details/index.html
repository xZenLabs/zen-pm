<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZenPM - Source Details</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="source-details-page-body">
    <div class="page source-details-page">
        <header class="details-header">
            <button id="backBtn" type="button" class="details-back-btn" aria-label="Back">
                <img src="../../assets/chevron.left.svg" alt="" class="details-back-icon">
            </button>
            <h2 id="sourceHeading">Source Details</h2>
        </header>

        <div class="source-details-scroll">
            <p id="sourceHint" class="hint">Loading source...</p>
            <section id="sourceSummary" class="source-summary"></section>
            <div id="sourcePackages" class="package-grid"></div>
        </div>
    </div>

    <script src="../../polyfill.js"></script>
    <script src="../../utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
