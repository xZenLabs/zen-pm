<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZenPM - Source Details</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="source-details-page-body">
    <div class="page source-details-page">
        <header class="details-header">
            <button id="backBtn" type="button" class="details-back-btn" aria-label="Back">
                <img src="../../assets/chevron.left.svg" alt="" class="details-back-icon">
            </button>
            <img id="sourceIcon" src="../../assets/sources.svg" alt="" class="source-header-icon" width="96" height="96">
            <div class="source-header-text">
                <div class="source-header-title-row">
                    <h2 id="sourceHeading">Source Details</h2>
                    <img id="sourceVerificationIcon" src="../../assets/unverified.svg" alt="" class="source-title-verification" width="38" height="38">
                </div>
                <p id="sourceUrl" class="source-header-url"></p>
            </div>
        </header>

        <h2 id="sourcePackagesHeading" class="source-packages-heading">Packages (0)</h2>

        <div class="source-details-scroll">
            <p id="sourceHint" class="hint">Loading source...</p>
            <div id="sourcePackages" class="package-grid"></div>
        </div>
    </div>

    <script src="../../polyfill.js"></script>
    <script src="../../utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
