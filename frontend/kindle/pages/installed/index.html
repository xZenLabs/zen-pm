<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZenPM - Installed</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="installed-page-body">
    <div class="page installed-page">
        <header class="topbar">
            <div class="search-pill">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <div class="search-row">
                    <span class="search-input-wrap">
                        <input id="installedSearch" type="text" placeholder="Filter installed..." autocomplete="off" spellcheck="false">
                    </span>
                    <span id="installedSearchClear" class="search-clear" role="button" tabindex="0" aria-label="Clear search">&times;</span>
                </div>
            </div>
        </header>

        <h2 id="installedHeading">Installed</h2>

        <div class="package-scroll">
            <p id="hint" class="hint">Connect to server to load packages.</p>
            <div id="installedList" class="package-grid"></div>
        </div>
    </div>

    <script src="../../polyfill.js"></script>
    <script src="../../utils.js"></script>
    <script src="installed.js"></script>
    <script>ZenUtils.renderNavbar('installed');</script>
</body>
</html>
