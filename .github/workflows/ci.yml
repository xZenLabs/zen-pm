name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile ARMhf
        run: GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -o /dev/null ./cmd/zenpm

      - name: Cross-compile ARMsf
        run: GOOS=linux GOARCH=arm GOARM=5 CGO_ENABLED=0 GOTOOLCHAIN=go1.20.14 go build -o /dev/null ./cmd/zenpm

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"

      - name: Build companion APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/23.2.8568313
        run: gradle -p android assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ZenPM-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          set -eu
          find installers -type f -name '*.sh' > /tmp/zenpm-shell-files.txt
          echo build.sh >> /tmp/zenpm-shell-files.txt
          xargs shellcheck -x < /tmp/zenpm-shell-files.txt

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          set -eu
          find installers -type f -name '*.sh' > /tmp/zenpm-shell-files.txt
          echo build.sh >> /tmp/zenpm-shell-files.txt
          while IFS= read -r file; do sh -n "$file"; done < /tmp/zenpm-shell-files.txt

  release:
    name: Build & Release
    needs: [go, android, shellcheck, shell-syntax]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Read and verify release version
        id: version
        run: |
          set -eu
          VERSION=$(sed -n '1{s/^[[:space:]]*//;s/[[:space:]]*$//;p;}' VERSION)
          META_VERSION=$(sed -n 's/^[[:space:]]*version = "\([^"]*\)".*/\1/p' frontend/koreader/zenpm.koplugin/_meta.lua)
          test -n "$VERSION"
          if [ "$VERSION" != "$META_VERSION" ]; then
            echo "VERSION ($VERSION) must match the KOReader plugin metadata version ($META_VERSION)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version is new
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android SDK and NDK
        if: steps.version_check.outputs.skip == 'false'
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"

      - name: Build Android companion APK
        if: steps.version_check.outputs.skip == 'false'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/23.2.8568313
        run: gradle -p android assembleRelease

      - name: Build release assets
        if: steps.version_check.outputs.skip == 'false'
        run: sh build.sh

      - name: Add Android companion APK to release assets
        if: steps.version_check.outputs.skip == 'false'
        run: cp android/app/build/outputs/apk/release/app-release.apk "dist/ZenPM-android-${{ steps.version.outputs.version }}.apk"

      - name: Build release notes
        if: steps.version_check.outputs.skip == 'false'
        run: python3 .github/scripts/build_release_notes.py "${{ steps.version.outputs.version }}" > release_notes.md

      - name: Create release and upload assets
        if: steps.version_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "ZenPM ${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.md
