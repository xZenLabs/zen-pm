name: Test & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          set -eu
          find installers scripts toolchains -type f -name '*.sh' > /tmp/zenpm-shell-files.txt
          echo build.sh >> /tmp/zenpm-shell-files.txt
          xargs shellcheck -x < /tmp/zenpm-shell-files.txt

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          set -eu
          find installers scripts toolchains -type f -name '*.sh' > /tmp/zenpm-shell-files.txt
          echo build.sh >> /tmp/zenpm-shell-files.txt
          while IFS= read -r file; do sh -n "$file"; done < /tmp/zenpm-shell-files.txt

  luacheck:
    name: LuaCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run LuaCheck gate
        uses: ./.github/actions/luacheck-gate

  go-test:
    name: Go tests
    needs: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run Go tests
        run: go test ./...

  release:
    name: Build & Release
    needs: [shellcheck, shell-syntax, luacheck, go-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'ci-skip')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Read and verify release version
        id: version
        run: |
          set -eu
          VERSION=$(sed -n '1{s/^[[:space:]]*//;s/[[:space:]]*$//;p;}' VERSION)
          META_VERSION=$(sed -n 's/^[[:space:]]*version = "\([^"]*\)".*/\1/p' frontend/koreader/zenpm.koplugin/_meta.lua)
          test -n "$VERSION"
          if [ "$VERSION" != "$META_VERSION" ]; then
            echo "VERSION ($VERSION) must match the KOReader plugin metadata version ($META_VERSION)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version is new
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android SDK and NDK
        if: steps.version_check.outputs.skip == 'false'
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Restore Android release signing key
        if: steps.version_check.outputs.skip == 'false'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/zenpm-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -D > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Build Android companion APK
        if: steps.version_check.outputs.skip == 'false'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/zenpm-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android testDebugUnitTest assembleRelease

      - name: Install release build tools
        if: steps.version_check.outputs.skip == 'false'
        run: brew install upx fonttools

      - name: Build release assets
        if: steps.version_check.outputs.skip == 'false'
        run: |
          sh scripts/verify-legacy-toolchain.sh
          sh build.sh

      - name: Add Android companion APK to release assets
        if: steps.version_check.outputs.skip == 'false'
        run: cp android/app/build/outputs/apk/release/app-release.apk "dist/ZenPM-android-${{ steps.version.outputs.version }}.apk"

      - name: Build release notes
        if: steps.version_check.outputs.skip == 'false'
        run: python3 .github/scripts/build_release_notes.py "${{ steps.version.outputs.version }}" > release_notes.md

      - name: Create release and upload assets
        if: steps.version_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "ZenPM ${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.md

      - name: Refresh ZenPM package
        if: steps.version_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.ZENPM_REPO_TOKEN }}
        run: |
          gh workflow run scrape-plugins.yml \
            --repo xZenLabs/repo \
            --ref main \
            --field package=zenpm
