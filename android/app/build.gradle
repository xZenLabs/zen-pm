plugins { id 'com.android.application' }

def zenpmVersion = file('../../VERSION').text.trim()
def zenpmVersionParts = zenpmVersion.replaceFirst('^v', '').tokenize('-')[0].tokenize('.')
if (zenpmVersionParts.size() != 3) {
    throw new GradleException("VERSION must be major.minor.patch, got: ${zenpmVersion}")
}
def zenpmVersionCode = zenpmVersionParts[0].toInteger() * 1000000 +
    zenpmVersionParts[1].toInteger() * 10000 + zenpmVersionParts[2].toInteger()
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace 'org.zenlabs.zenpm'
    compileSdk 34
    defaultConfig {
        applicationId 'org.zenlabs.zenpm'
        minSdk 19
        targetSdk 34
        versionCode zenpmVersionCode
        versionName zenpmVersion
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

tasks.register('buildZenPMNative', Exec) {
    workingDir rootProject.projectDir
    commandLine 'sh', 'build-native.sh'
    inputs.dir(rootProject.file('../internal'))
    inputs.dir(rootProject.file('backend'))
    outputs.dir(rootProject.file('app/src/main/jniLibs'))
}
preBuild.dependsOn tasks.named('buildZenPMNative')
