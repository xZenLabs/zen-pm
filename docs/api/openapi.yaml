openapi: 3.0.3
info:
  title: ZenPM Local Daemon API
  version: 1.0.0
  description: |
    OpenAPI reference for the Zen Package Manager HTTP daemon.

    The daemon binds to loopback only (`127.0.0.1`) and is intended for calls
    from the Kindle WAF frontend, on-device scripts, and local development
    tools. It does not use HTTP authentication; access control is enforced by
    accepting requests only from `127.0.0.1` or `::1`.

    CORS is enabled for local browser/WAF clients. All routes return `204` for
    `OPTIONS` preflight requests.
servers:
  - url: http://127.0.0.1:18765
    description: Default local daemon
tags:
  - name: Health
  - name: Repositories
  - name: Packages
  - name: Logs
  - name: Kindle UI
  - name: Maintenance
paths:
  /health:
    get:
      tags:
        - Health
      summary: Check daemon health and version
      operationId: getHealth
      responses:
        "200":
          description: Daemon is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                ok: true
                version: 1.2.3
  /repos:
    get:
      tags:
        - Repositories
      summary: List configured repositories
      operationId: listRepos
      responses:
        "200":
          description: Configured repositories, including built-in defaults.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
              example:
                - name: ZenLabs
                  url: https://xzenlabs.github.io/repo
                  priority: 10
                  trust: trusted
                  default: true
                - name: my-repo
                  url: https://example.com/my-repo/
                  priority: 100
                  trust: warn-unsigned
                  default: false
        "500":
          $ref: "#/components/responses/JsonError"
    post:
      tags:
        - Repositories
      summary: Add a repository
      description: |
        Adds a user repository. Priority and trust are determined by the daemon:
        user-added repositories receive priority `100`, and trust is inferred
        from repository signing and URL safety checks.
      operationId: addRepo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRepositoryRequest"
            example:
              name: my-repo
              url: https://example.com/my-repo/
      responses:
        "201":
          description: Repository was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddRepositoryResponse"
              examples:
                added:
                  value:
                    ok: true
                addedWithWarning:
                  value:
                    ok: true
                    warning: repo URL uses plain HTTP - consider using HTTPS for security
        "400":
          $ref: "#/components/responses/TextError"
        "409":
          $ref: "#/components/responses/JsonError"
        "500":
          $ref: "#/components/responses/JsonError"
  /repos/{name}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    put:
      tags:
        - Repositories
      summary: Replace a user repository
      description: |
        Replaces an existing non-default repository by removing and re-adding it
        under the same name. Built-in default repositories cannot be modified.
      operationId: updateRepo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepositoryRequest"
            example:
              url: https://example.com/my-repo/
              priority: 100
              trust: warn-unsigned
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/TextError"
        "403":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"
        "500":
          $ref: "#/components/responses/JsonError"
    delete:
      tags:
        - Repositories
      summary: Remove a user repository
      description: Built-in default repositories cannot be removed.
      operationId: deleteRepo
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/TextError"
        "403":
          $ref: "#/components/responses/JsonError"
        "404":
          $ref: "#/components/responses/JsonError"
  /repo/refresh:
    post:
      tags:
        - Repositories
      summary: Refresh the merged package catalog
      description: Fetches all configured repositories, merges catalog entries by priority, and caches uninstall scripts for installed packages.
      operationId: refreshRepos
      responses:
        "200":
          description: Catalog refresh completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
              example:
                ok: true
                log: "Refreshing repo ZenLabs from https://xzenlabs.github.io/repo\nCatalog refreshed: 12 packages total"
        "405":
          $ref: "#/components/responses/TextError"
        "500":
          description: Refresh failed. The response includes the current log tail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
              example:
                ok: false
                error: no repositories configured
                log: ""
  /koreader/plugins/scan:
    post:
      tags:
        - Maintenance
      summary: Scan installed external KOReader plugins
      description: |
        Forces a scan of external `.koplugin` directories, excluding KOReader
        built-ins and patch packages. Matching catalog packages are recorded as
        installed using their `_meta.lua` version.
      operationId: scanKOReaderPlugins
      responses:
        "200":
          description: Plugin scan completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KOReaderPluginScanResponse"
              example:
                ok: true
                scanned: 3
                matched: 2
                added: 1
                updated: 1
        "405":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/JsonError"
  /packages:
    get:
      tags:
        - Packages
      summary: List packages
      description: |
        Returns packages from the merged catalog, optionally filtered by
        platform capabilities. A package is returned only when every declared
        platform is present in the filter. Packages already installed on the
        device but missing from the catalog are included as installed device
        packages.
      operationId: listPackages
      parameters:
        - name: platform
          in: query
          required: false
          description: Comma-separated platform capability filter. Omit to return all packages.
          schema:
            type: string
          example: kindle,koreader
        - name: beta
          in: query
          required: false
          description: Set to `1` to include beta updates.
          schema:
            type: boolean
        - name: alpha
          in: query
          required: false
          description: Set to `1` to include ZenOS alpha updates.
          schema:
            type: boolean
      responses:
        "200":
          description: Package list. If the catalog has not been built yet, this may be an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
              example:
                - id: koreader-kindle
                  name: KOReader
                  version: 2026.05
                  description: E-book reader for Kindle.
                  author: KOReader contributors
                  tags:
                    - reader
                  category: Media
                  platforms:
                    - kindle
                    - koreader
                  repo: ZenLabs
                  repo_trust: trusted
                  repo_default: true
                  installed: false
                  installed_version: ""
                  latest_version: v2026.05
                  update_available: false
                  icon_url: https://example.com/favicon.svg
                  repo_icon_url: https://example.com/favicon.svg
                  image_url: https://example.com/packages/koreader/screenshot.png
                  images:
                    - https://example.com/packages/koreader/screenshot.png
                  featured: true
                  featured_order: 10
                  featured_image: https://example.com/packages/koreader/featured.png
                  source: https://github.com/koreader/koreader
        "405":
          $ref: "#/components/responses/TextError"
  /packages/{id}/install:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags:
        - Packages
      summary: Start package installation
      description: |
        Starts installation asynchronously and returns immediately. Clients can
        poll `/log` to observe progress and failures. Passing `release` installs
        that repository-cached release and records its tag as the installed version.
      operationId: installPackage
      parameters:
        - name: asset
          in: query
          required: false
          description: Exact release ZIP asset name selected by the client.
          schema:
            type: string
        - name: release
          in: query
          required: false
          description: Release tag from the package's `versions_url` to install instead of the catalog release.
          schema:
            type: string
      responses:
        "202":
          $ref: "#/components/responses/Started"
        "400":
          $ref: "#/components/responses/TextError"
        "405":
          $ref: "#/components/responses/TextError"
  /packages/{id}/reinstall:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags:
        - Packages
      summary: Reinstall a package cleanly
      description: |
        Starts an uninstall followed by an installation asynchronously. Clients
        can poll `/log` to observe progress and failures. Passing `release`
        installs that repository-cached release after removal.
      operationId: reinstallPackage
      parameters:
        - name: asset
          in: query
          required: false
          description: Exact release ZIP asset name selected by the client.
          schema:
            type: string
        - name: release
          in: query
          required: false
          description: Release tag from the package's `versions_url` to install after removal.
          schema:
            type: string
      responses:
        "202":
          $ref: "#/components/responses/Started"
        "400":
          $ref: "#/components/responses/TextError"
        "405":
          $ref: "#/components/responses/TextError"
  /packages/{id}/readme:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags:
        - Packages
      summary: Read the package README
      operationId: getPackageReadme
      responses:
        "200":
          description: Raw README Markdown and the directory used to resolve its relative links and images.
          content:
            application/json:
              schema:
                type: object
                required:
                  - readme
                  - readme_base_url
                  - readme_image_base_url
                  - readme_image_refs
                properties:
                  readme:
                    type: string
                  readme_base_url:
                    type: string
                    format: uri
                  readme_image_base_url:
                    type: string
                    format: uri
                  readme_image_refs:
                    type: object
                    description: Maps resolved README image URLs to local ref files. Each ref is written asynchronously with either the prepared image path or `failed`.
                    additionalProperties:
                      type: string
        "404":
          $ref: "#/components/responses/TextError"
        "502":
          $ref: "#/components/responses/TextError"
  /packages/{id}/releases:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags:
        - Packages
      summary: List recent installable releases
      description: Returns releases from the package's repository-hosted `versions_url`. Source packages may use generated source archives as release assets; for those packages, releases without usable assets are omitted so installation can fall back to the current `source_url`.
      operationId: listPackageReleases
      responses:
        "200":
          description: Recent releases and their ZIP assets.
          content:
            application/json:
              schema:
                type: object
                required:
                  - releases
                properties:
                  releases:
                    type: array
                    items:
                      $ref: "#/components/schemas/GitHubRelease"
        "404":
          $ref: "#/components/responses/TextError"
        "502":
          $ref: "#/components/responses/TextError"
  /packages/{id}/uninstall:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags:
        - Packages
      summary: Start package removal
      description: |
        Starts uninstallation asynchronously and returns immediately. Clients can
        poll `/log` to observe progress and failures.
      operationId: uninstallPackage
      responses:
        "202":
          $ref: "#/components/responses/Started"
        "400":
          $ref: "#/components/responses/TextError"
        "405":
          $ref: "#/components/responses/TextError"
  /packages/{id}/update-ignored:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags:
        - Packages
      summary: Set whether updates ignore an installed package or its current version
      operationId: setPackageUpdateIgnored
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - update_ignored
              properties:
                update_ignored:
                  type: boolean
                  description: Set true to ignore all updates, or false to allow them.
                update_ignored_version:
                  type: string
                  description: Suppress only this offered update version. `update_ignored` must be false.
      responses:
        "200":
          description: The installed package preference was saved.
        "400":
          $ref: "#/components/responses/TextError"
        "404":
          $ref: "#/components/responses/TextError"
        "405":
          $ref: "#/components/responses/TextError"
  /log:
    get:
      tags:
        - Logs
      summary: Read recent daemon log output
      operationId: getLog
      parameters:
        - name: tail
          in: query
          required: false
          description: Number of log lines to return. Defaults to 200.
          schema:
            type: integer
            minimum: 1
            default: 200
          example: 500
      responses:
        "200":
          description: Log tail as plain text.
          content:
            text/plain:
              schema:
                type: string
              example: "ZenPM server listening on 127.0.0.1:18765\nGET /health 200"
        "404":
          $ref: "#/components/responses/TextError"
  /log/client:
    post:
      tags:
        - Logs
      summary: Relay a frontend log message
      description: Writes a Kindle WAF JavaScript diagnostic message into the daemon log file.
      operationId: postClientLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientLogRequest"
            example:
              message: "[sources] refresh tapped"
      responses:
        "204":
          description: Message accepted.
        "400":
          $ref: "#/components/responses/TextError"
        "405":
          $ref: "#/components/responses/TextError"
  /dialog:
    post:
      tags:
        - Kindle UI
      summary: Show a native Kindle dialog
      description: Uses the Kindle pillow alert LIPC interface to show a native alert dialog.
      operationId: showDialog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DialogRequest"
            example:
              title: ZenPM
              message: "Version: 1.2.3"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/TextError"
        "405":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/JsonError"
  /foreground:
    post:
      tags:
        - Kindle UI
      summary: Bring the ZenPM WAF app to the foreground
      operationId: foregroundApp
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "405":
          $ref: "#/components/responses/TextError"
  /update:
    post:
      tags:
        - Maintenance
      summary: Start Kindle self-update
      description: |
        Starts a detached backend maintenance process. The updater may stop and
        restart the daemon.
      operationId: startUpdate
      responses:
        "202":
          description: Update started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              example:
                ok: true
        "400":
          $ref: "#/components/responses/JsonError"
        "405":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/JsonError"
  /uninstall:
    post:
      tags:
        - Maintenance
      summary: Uninstall ZenPM from Kindle
      description: |
        Starts a detached backend maintenance process that removes the Kindle
        app and payload. Set `remove_settings=true` to also remove persistent state.
      operationId: uninstallZenPM
      parameters:
        - name: remove_settings
          in: query
          schema:
            type: boolean
      responses:
        "202":
          description: Uninstall started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
              example:
                ok: true
        "400":
          $ref: "#/components/responses/JsonError"
        "405":
          $ref: "#/components/responses/TextError"
        "500":
          $ref: "#/components/responses/JsonError"
components:
  parameters:
    RepoName:
      name: name
      in: path
      required: true
      description: Repository name as stored in `repos.db`.
      schema:
        type: string
        minLength: 1
      example: my-repo
    PackageId:
      name: id
      in: path
      required: true
      description: Package identifier from the merged catalog.
      schema:
        type: string
        minLength: 1
      example: koreader-kindle
  responses:
    Ok:
      description: Operation completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OkResponse"
          example:
            ok: true
    Started:
      description: Operation was accepted and started asynchronously.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StartedResponse"
          example:
            ok: true
            started: true
    JsonError:
      description: JSON error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: repo "my-repo" already exists
    TextError:
      description: Plain-text error response emitted by legacy handlers.
      content:
        text/plain:
          schema:
            type: string
          examples:
            badRequest:
              value: "bad request\n"
            method:
              value: "POST required\n"
            forbidden:
              value: "forbidden\n"
  schemas:
    HealthResponse:
      type: object
      required:
        - ok
        - version
      properties:
        ok:
          type: boolean
          example: true
        version:
          type: string
          description: Version injected at build time or `dev` in local builds.
          example: 1.2.3
    Repository:
      type: object
      required:
        - name
        - url
        - priority
        - trust
        - default
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        priority:
          type: integer
          description: Lower numbers have higher precedence.
          example: 100
        trust:
          $ref: "#/components/schemas/TrustLevel"
        default:
          type: boolean
          description: Built-in repositories are protected from modification and removal.
        icon_url:
          type: string
          format: uri
          description: Resolved repository icon URL from `manifest.json` repo metadata, when available.
    TrustLevel:
      type: string
      enum:
        - trusted
        - signed
        - warn-unsigned
      description: |
        `trusted` is used for built-in repositories, `signed` for repositories
        with a valid `manifest.json.sig`, and `warn-unsigned` for unsigned or
        plain-HTTP repositories.
    AddRepositoryRequest:
      type: object
      required:
        - name
        - url
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
          description: Repository base URL. A trailing slash is recommended.
          example: https://example.com/my-repo/
    UpdateRepositoryRequest:
      type: object
      required:
        - url
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
        priority:
          type: integer
          default: 100
          description: Defaults to `100` when omitted or `0`.
        trust:
          allOf:
            - $ref: "#/components/schemas/TrustLevel"
          default: warn-unsigned
    AddRepositoryResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true
        warning:
          type: string
          description: Present when the repository URL has a safety warning.
    RefreshResponse:
      type: object
      required:
        - ok
        - log
      properties:
        ok:
          type: boolean
        error:
          type: string
          description: Present when `ok` is false.
        log:
          type: string
          description: Tail of the daemon log captured after refresh.
    KOReaderPluginScanResponse:
      type: object
      required:
        - ok
        - scanned
        - matched
        - added
        - updated
      properties:
        ok:
          type: boolean
        scanned:
          type: integer
          description: External `.koplugin` directories examined.
        matched:
          type: integer
          description: Scanned plugins matched to a non-patch catalog package.
        added:
          type: integer
          description: Newly recorded installed packages.
        updated:
          type: integer
          description: Existing package records whose plugin metadata changed.
    Package:
      type: object
      required:
        - id
        - name
        - version
        - description
        - author
        - tags
        - platforms
        - repo
        - installed
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        author:
          type: string
        tags:
          type: array
          nullable: true
          items:
            type: string
        category:
          type: string
          description: Repository-provided category, such as Media, Utility, Productivity, or Games.
        platforms:
          type: array
          nullable: true
          items:
            type: string
            enum:
              - kindle
              - kobo
              - android
              - host
              - koreader
        incompatible_platforms:
          type: array
          items:
            type: string
          description: Platform capabilities that explicitly exclude the package.
        conflicts:
          type: array
          items:
            type: string
          description: Package IDs that should not be used together; the client warns but may allow installation.
        repo:
          type: string
        repo_trust:
          $ref: "#/components/schemas/TrustLevel"
        repo_default:
          type: boolean
        installed:
          type: boolean
        installed_version:
          type: string
          description: Version recorded at install time, when the package is installed.
        installed_at:
          type: string
          format: date-time
          description: UTC timestamp recorded when the package was installed.
        installed_asset_dates:
          type: object
          additionalProperties:
            type: string
            format: date-time
          description: UTC install timestamps by installed patch-file asset.
        published_at:
          type: string
          format: date-time
          description: Package publication timestamp supplied by the repository.
        latest_version:
          type: string
          description: Latest stable or enabled prerelease version declared by the repository.
        prerelease_version:
          type: string
          description: Latest beta version declared by the repository.
        alpha_version:
          type: string
          description: Latest ZenOS alpha version declared by the repository.
        update_available:
          type: boolean
          description: True when `latest_version` is newer than `installed_version`.
        update_ignored:
          type: boolean
          description: True when the current offered update is suppressed.
        icon_url:
          type: string
          format: uri
        repo_icon_url:
          type: string
          format: uri
        image_url:
          type: string
          format: uri
          description: First image URL from `images`, when present.
        images:
          type: array
          items:
            type: string
            format: uri
        featured:
          type: boolean
        featured_order:
          type: integer
          description: Ascending position on the Featured page. Packages without a value follow ordered packages.
        featured_image:
          type: string
          format: uri
        source:
          type: string
          format: uri
          description: Upstream package source URL.
        readme_url:
          type: string
          format: uri
          description: Repository-hosted README Markdown URL, when available.
        versions_url:
          type: string
          format: uri
          description: Repository-hosted cached release metadata used by the version picker and installer. When omitted, no version history is available.
    GitHubRelease:
      type: object
      required:
        - tag_name
        - assets
      properties:
        tag_name:
          type: string
        name:
          type: string
        prerelease:
          type: boolean
        assets:
          type: array
          items:
            type: object
            required:
              - name
              - url
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true
    StartedResponse:
      type: object
      required:
        - ok
        - started
      properties:
        ok:
          type: boolean
          example: true
        started:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    ClientLogRequest:
      type: object
      required:
        - message
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
    DialogRequest:
      type: object
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
        message:
          type: string
          default: ""
